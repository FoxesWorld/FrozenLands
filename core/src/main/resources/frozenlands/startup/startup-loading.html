<!doctype html>
<html id="startup-root" data-screen="startup-logo">
<head>
  <meta charset="utf-8">
  <title>FrozenLands Startup</title>
</head>
<body>
  <div id="boot-root" class="boot-root" data-motion="enter">
    <div class="boot-vignette"></div>
    <div class="boot-aurora aurora-left"></div>
    <div class="boot-aurora aurora-right"></div>
    <div class="boot-drift drift-a"></div>
    <div class="boot-drift drift-b"></div>
    <div class="boot-drift drift-c"></div>

    <div class="boot-card">
      <div id="boot-logo" class="boot-logo" aria-label="FrozenLands boot logo">
        <div class="boot-logo-aura aura-a"></div>
        <div class="boot-logo-aura aura-b"></div>
        <div class="boot-logo-frame">
          <div class="boot-logo-spin">
            <div class="boot-logo-image"></div>
          </div>
          <div class="boot-logo-scan scan-a"></div>
          <div class="boot-logo-scan scan-b"></div>
        </div>
      </div>

      <div class="boot-wordmark">
        <div class="boot-logo-text" aria-label="FrozenLands"></div>
        <div class="boot-subtitle">FrozenLands runtime boot sequence</div>
      </div>

      <div class="boot-progress-shell" aria-label="Startup progress">
        <div class="boot-progress-track">
          <div id="boot-progress-fill" class="boot-progress-fill" style="width: 0%;"></div>
          <div class="boot-progress-shine"></div>
        </div>
        <div id="boot-progress-label" class="boot-progress-label">0%</div>
      </div>

      <div id="boot-stage" class="boot-stage">Opening FrozenLands window</div>

      <div class="boot-pulse-row">
        <span class="boot-pulse dot-1"></span>
        <span class="boot-pulse dot-2"></span>
        <span class="boot-pulse dot-3"></span>
      </div>
    </div>
  </div>
</body>
</html>
